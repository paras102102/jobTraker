services:
  db:
    image: postgres:16-alpine
    container_name: jobtrackr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtrackr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtrackr_password}
      POSTGRES_DB: ${POSTGRES_DB:-jobtrackr_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtrackr_user} -d ${POSTGRES_DB:-jobtrackr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtrackr_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobtrackr_user}:${POSTGRES_PASSWORD:-jobtrackr_password}@db:5432/${POSTGRES_DB:-jobtrackr_db}
      SECRET_KEY: ${SECRET_KEY:-dev_insecure_secret_key_change_in_production_min_32_chars}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    name: jobtrackr_postgres_data
